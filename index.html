<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Link</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 2rem; }
  button { padding: .6rem 1.2rem; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>

<h1>Open a site</h1>
<button id="openBtn">Open example.com in new tab</button>

<script>
document.getElementById('openBtn').addEventListener('click', function () {
  const win = window.open('https://example.com', '_blank', 'noopener,noreferrer');
  // try (not guaranteed) to keep focus on the current tab
  if (win) { win.blur(); window.focus(); }
});
</script>

</body>
</html>
