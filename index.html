<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Popup Opener</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 2rem; }
  button { padding: .6rem 1.2rem; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>

<h1>Open a popup</h1>
<button id="openBtn">Open example.com as popup</button>

<script>
window.open('https://example.com', 'popup', 'width=800,height=600');
</script>
  
</body>
</html>
